
# ##############################################################################
# PODIUM PUSH CONFIG - Final 100k Steps
# ##############################################################################

seed: 42
mixed_precision: "fp16"

# --- Resuming ---
# We point to your best model to start the refinement
resume: true
resume_path: "best_model_version_3.pth"

# --- Model ---
# Must match your current architecture exactly
embed_dim: 31
num_blocks: 20

# --- Paths ---
lmdb_dir: "dataset/sidd_lmdb"
output_dir: "checkpoints/podium-push"

# --- schedule ---
# We reset the scheduler and train for 100k steps at 256x256
total_iters: 400000            # Total (300k old + 100k new)
patch_sizes: [256]            # Force 256x256
batch_sizes: [2]              # Batch size for 256x256
phase_milestones: []          # No milestones, stay at phase 0

# --- Optimizer ---
# "Re-ignite" the training with a higher learning rate than the previous decay
lr_initial: 2.0e-5
lr_min: 1.0e-7
weight_decay: 0.0

# --- Weights ---
charbonnier_weight: 1.0
wavelet_weight: 0.1           # Increased wavelet weight for better texture/detail
ssim_weight: 0.1              # Enabled SSIM for better perceptual quality

# --- Logging ---
val_freq: 1000
checkpoint_freq: 5000
wandb_project: "sidd-hasst-podium"
